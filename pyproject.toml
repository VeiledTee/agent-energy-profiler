[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-energy-profiler"
version = "0.4.0"
description = "Hardware-grounded, operation-level energy profiling for agentic systems"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ethan Heavey" }]
keywords = ["energy", "profiling", "gpu", "nvml", "rapl", "agents", "llm",
            "opentelemetry"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: System :: Hardware",
    "Topic :: System :: Monitoring",
]
# No required runtime dependencies: the package degrades to reporting a domain
# as unavailable rather than failing, and never fabricates a measurement.
dependencies = []

[project.optional-dependencies]
# NVIDIA GPU energy counters. Without it, GPU energy is reported unavailable.
# nvidia-ml-py is NVIDIA's official binding and provides the `pynvml` module
# imported by agent_energy_profiler/hardware/nvml.py. The separately published
# `pynvml` distribution wraps it and emits a FutureWarning on import; do not
# install both, since they claim the same module name.
gpu = ["nvidia-ml-py>=12.535"]
# Figures (agent_energy_profiler.visualize). Imported only when drawing.
plot = ["matplotlib>=3.5"]
# OpenTelemetry integration (agent_energy_profiler.otel): trace correlation
# needs only the API; exporting spans needs the SDK. Imported only by
# agent_energy_profiler.otel and `agent-energy-profiler otel-export`.
otel = ["opentelemetry-api>=1.20", "opentelemetry-sdk>=1.20"]
# `agent-energy-profiler otel-export --endpoint`: OTLP over HTTP.
otlp = ["opentelemetry-api>=1.20", "opentelemetry-sdk>=1.20",
        "opentelemetry-exporter-otlp-proto-http>=1.20"]
# Test runner only: the suite passes, skipping optional-dependency tests.
dev = ["pytest>=8"]
# The full suite with no optional-dependency skips (figures, numpy/pandas
# interop, OpenTelemetry). Core never imports these. The LangGraph
# compatibility tests need `langgraph` installed separately.
test = ["pytest>=8", "matplotlib>=3.5", "numpy", "pandas",
        "opentelemetry-api>=1.20", "opentelemetry-sdk>=1.20"]

[project.urls]
Homepage = "https://github.com/VeiledTee/agent-energy-profiler"
Source = "https://github.com/VeiledTee/agent-energy-profiler"
Issues = "https://github.com/VeiledTee/agent-energy-profiler/issues"
Changelog = "https://github.com/VeiledTee/agent-energy-profiler/blob/main/CHANGELOG.md"
Documentation = "https://github.com/VeiledTee/agent-energy-profiler#readme"

# One command, named like the distribution. The single-purpose scripts below
# predate it and share its prefix; `python -m agent_energy_profiler` is
# equivalent to the main command.
[project.scripts]
agent-energy-profiler = "agent_energy_profiler.cli:main"
agent-energy-profiler-sample = "agent_energy_profiler.sampling:main"
agent-energy-profiler-attribute = "agent_energy_profiler.attribution:main"
agent-energy-profiler-attribute-v2 = "agent_energy_profiler.attribution_v2:main"
agent-energy-profiler-validate = "agent_energy_profiler.validation:main"
agent-energy-profiler-aggregate = "agent_energy_profiler.aggregate:main"
agent-energy-profiler-visualize = "agent_energy_profiler.visualize:main"

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["agent_energy_profiler", "agent_energy_profiler.hardware"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "frozen_runs: re-attributes full research runs; needs AEP_FROZEN_RUNS_DIR (opt-in)",
]
